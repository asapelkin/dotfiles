---
- hosts: localhost
  connection: local
  vars:
    github_base: https://github.com
    homebrew_installer: https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
    use_homebrew: true
    home: "{{ lookup('env', 'HOME') }}"
    packages:
      - { apt: git, brew: git }
      - { apt: fzf, brew: fzf }
      - { apt: bat, brew: bat }
      - { apt: ripgrep, brew: ripgrep }
      - { apt: fd-find, brew: fd }
      - { apt: btop, brew: btop }
      - { apt: yazi, brew: yazi }
      - { apt: python3, brew: python }
      - { apt: python3-venv, brew: python }
      - { apt: nodejs, brew: node }
      - { apt: vim, brew: vim }
      - { apt: zsh, brew: zsh }
    plugins:
      - { repo: ohmyzsh/ohmyzsh, name: oh-my-zsh, version: master }
      - { repo: unixorn/fzf-zsh-plugin, name: fzf-zsh-plugin, version: e3894e83a3e8a3e8751456d56c51bb49b34e8d2b }
      - { repo: MichaelAquilina/zsh-you-should-use, name: you-should-use, version: 5f3d129864ee4505043d88c3486224f1d75b692e }
      - { repo: zsh-users/zsh-history-substring-search, name: zsh-history-substring-search, version: master }
      - { repo: popstas/zsh-command-time, name: command-time, version: f163ac1d41f8645d1d055393e52692e2ee185e5f }
      - { repo: asapelkin/zsh-just-let-me-edit-my-files, name: zsh-just-let-me-edit-my-files, version: a1a6acd2c9d5e289e0a1ac471f6b7ba7fd8289c6 }
      - { repo: zsh-users/zsh-autosuggestions, name: zsh-autosuggestions, version: 85919cd1ffa7d2d5412f6d3fe437ebdbeeec4fc5 }
      - { repo: zsh-users/zsh-syntax-highlighting, name: zsh-syntax-highlighting, version: e6683f20e5c38d3e5447f45845d04ddda75d0f23 }
  tasks:
    - name: Check platform and user
      ansible.builtin.assert:
        that:
          - ansible_facts.user_id != 'root'
          - home | length > 0
          - ansible_facts.os_family in ['Debian', 'Darwin']
      tags: always

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      become: true
      when: ansible_facts.os_family == 'Debian'
      tags: packages

    - name: Check apt packages
      ansible.builtin.command: "apt-cache policy {{ item.apt }}"
      environment:
        LC_ALL: C
      register: apt_packages
      changed_when: false
      loop: "{{ packages }}"
      when: ansible_facts.os_family == 'Debian'
      tags: packages

    - name: Select packages
      ansible.builtin.set_fact:
        apt_install: "{{ apt_packages.results | selectattr('stdout', 'search', 'Candidate: (?!\\(none\\))\\S+') | map(attribute='item.apt') | list }}"
        apt_unavailable: "{{ apt_packages.results | rejectattr('stdout', 'search', 'Candidate: (?!\\(none\\))\\S+') | map(attribute='item.apt') | list }}"
        brew_install: "{{ apt_packages.results | rejectattr('stdout', 'search', 'Candidate: (?!\\(none\\))\\S+') | map(attribute='item.brew') | unique | list }}"
      when: ansible_facts.os_family == 'Debian'
      tags: packages

    - name: Install apt packages
      ansible.builtin.apt:
        name: "{{ apt_install }}"
        state: present
      become: true
      when: ansible_facts.os_family == 'Debian'
      tags: packages

    - name: Select macOS packages
      ansible.builtin.set_fact:
        brew_install: "{{ packages | map(attribute='brew') | unique | list }}"
      when: ansible_facts.os_family == 'Darwin'
      tags: packages

    - name: Report packages skipped without Homebrew
      ansible.builtin.debug:
        msg: "Homebrew disabled; packages skipped: {{ (apt_unavailable if ansible_facts.os_family == 'Debian' else brew_install) | join(', ') }}"
      when:
        - not (use_homebrew | bool)
        - brew_install | length > 0
      tags: packages

    - name: Install packages through Homebrew
      when: use_homebrew | bool
      tags: packages
      block:
        - name: Locate Homebrew
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - /home/linuxbrew/.linuxbrew/bin/brew
            - /opt/homebrew/bin/brew
            - /usr/local/bin/brew
          register: brew_locations

        - name: Install Homebrew
          when: brew_locations.results | selectattr('stat.exists') | list | length == 0
          block:
            - name: Create download directory
              ansible.builtin.file:
                path: "{{ home }}/.local/share/dotfiles"
                state: directory
                mode: "0755"
            - name: Download Homebrew installer
              ansible.builtin.get_url:
                url: "{{ homebrew_installer }}"
                dest: "{{ home }}/.local/share/dotfiles/homebrew-install.sh"
                mode: "0755"
            - name: Run Homebrew installer
              ansible.builtin.command:
                argv:
                  - bash
                  - "{{ home }}/.local/share/dotfiles/homebrew-install.sh"
              environment:
                NONINTERACTIVE: "1"
              changed_when: true

        - name: Locate installed Homebrew
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - /home/linuxbrew/.linuxbrew/bin/brew
            - /opt/homebrew/bin/brew
            - /usr/local/bin/brew
          register: brew_locations

        - name: Select Homebrew executable
          ansible.builtin.set_fact:
            brew: "{{ brew_locations.results | selectattr('stat.executable', 'defined') | selectattr('stat.executable') | map(attribute='item') | first }}"

        - name: Check Homebrew packages
          ansible.builtin.command: "{{ brew }} list --versions {{ item }}"
          environment:
            HOMEBREW_NO_AUTO_UPDATE: "1"
          loop: "{{ brew_install }}"
          register: brew_packages
          changed_when: false
          failed_when: brew_packages.rc not in [0, 1]

        - name: Install missing Homebrew packages
          ansible.builtin.command: "{{ brew }} install {{ item.item }}"
          environment:
            HOMEBREW_NO_AUTO_UPDATE: "1"
          loop: "{{ brew_packages.results }}"
          when: item.rc == 1
          changed_when: true

    - name: Create plugin directory
      ansible.builtin.file:
        path: "{{ home }}/.local/share/dotfiles"
        state: directory
        mode: "0755"
      tags: plugins

    - name: Install Zsh plugins
      ansible.builtin.git:
        repo: "{{ github_base }}/{{ item.repo }}.git"
        dest: "{{ home }}/.local/share/dotfiles/{{ item.name }}"
        version: "{{ item.version }}"
      loop: "{{ plugins }}"
      tags: plugins

    - name: Install Zsh configuration
      ansible.builtin.copy:
        src: .zshrc
        dest: "{{ home }}/.zshrc"
        mode: "0644"
        backup: true
      tags: config
